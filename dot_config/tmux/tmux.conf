# Revise from https://gist.github.com/tsl0922/d79fc1f8097dde660b34

set -g base-index 1
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

set -g mouse on
set -g prefix C-s
set-option -g default-terminal screen-256color
set-option -sa terminal-overrides ",xterm*:Tc"
set -g history-limit 50000

# For 3rd/image.nvim
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on
bind-key w choose-session

# use vim-like keys for splits and windows
bind c new-window -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


bind-key [ copy-mode
bind-key ] paste-buffer

birndmove-window -r\;                        \
    display-message "Windows reordered..."

# Setup 'v' to begin selection as in Vim
set-option -g set-clipboard on
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection

bind-key -T copy-mode-vi y send-key -X copy-pipe "xclip -i -selection clipboard"
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# Vi 
set -g mode-keys vi

# Status Bar
set-option -g status-interval 1
set-option -g status-style bg=black
set-option -g status-style fg=black
set -g status-position top
set -g status-left '#[fg=black]#S #[default]'
set -g status-right '#{host} %a %H:%M:%S #[fg=black]%Y-%m-%d'
set -g mode-style "fg=white,bg=colour238"

set-option -g pane-active-border-style fg=black
set-option -g pane-border-style fg=black

# TMUX Plugin Manager (XDG path)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'
run '~/.local/share/tmux/plugins/tpm/tpm'
