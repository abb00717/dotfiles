# Generated from GNOME Terminal Profile: ea372b6e-e10d-41c4-9cd5-2d7ed8332bb2
# Copy content below to your ~/.config/kitty/kitty.conf

## Fonts
font_family      JetBrainsMono Nerd Font
font_size        18

## Color Scheme
## name: Alabaster
## author: Nikita Prokopov
## license: MIT
## upstream: https://raw.githubusercontent.com/anmolmathias/kitty-alabaster/master/alabaster.conf
## blurb: A light color scheme adapted from Alabaster for the kitty terminal.

#: The basic colors

foreground              #000000
background              #efebe3

selection_foreground    #000000
selection_background    #bfdbfe


#: Cursor colors

cursor                  #007acc
cursor_text_color       #bfdbfe


#: URL underline color when hovering with mouse

url_color               #325cc0


#: The basic 16 colors

#: black
color0                  #000000
color8                  #777777

#: red
color1                  #aa3731
color9                  #c0392b

#: green
color2                  #448c37
color10                 #2e7d32

#: yellow
color3                  #8a6200
color11                 #9c6f00

#: blue
color4                  #325cc0
color12                 #007acc

#: magenta
color5                  #7a3e9d
color13                 #a0359a

#: cyan
color6                  #0083b2
color14                 #007f94

#: white
color7                  #555555
color15                 #222222


#: 256-color overrides for tools that hardcode xterm palette indices
#: (one_gadget). The defaults are tuned for dark backgrounds.

color82                 #448c37
color189                #7a3e9d
color196                #aa3731
color203                #aa3731
color230                #8a6200


#: kitty window border colors and terminal bell colors

active_border_color             #777777
inactive_border_color           #cccccc
bell_border_color               #e97e57


#: Tab bar colors

active_tab_foreground           #000000
active_tab_background           #f7f7f7
inactive_tab_foreground         #444444
inactive_tab_background         #dedede

## Cursor
shell_integration no-cursor ## Prevent kitty's shell integration change cursor automatically
cursor_shape     block
cursor_blink_interval -1
## cursor_trail 1

## Behavior
scrollback_lines 10000
enable_audio_bell no
window_padding_width 4

## Clipboard
clipboard_control write-clipboard read-clipboard
